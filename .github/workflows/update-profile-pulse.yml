name: Refresh profile research pulse

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/update_research_pulse.py"
      - ".github/workflows/update-profile-pulse.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate research pulse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_research_pulse.py

      - name: Commit pulse only when it changed
        run: |
          if git diff --quiet -- assets/research-pulse.svg; then
            echo "Research pulse is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/research-pulse.svg
          git commit -m "chore: refresh profile research pulse"
          git push
