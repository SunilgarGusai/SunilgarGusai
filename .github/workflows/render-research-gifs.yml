name: Render animated research covers

on:
  push:
    branches: [main, restore-animated-gallery-v5]
    paths:
      - 'assets/*.svg'
      - '.github/scripts/render_research_gifs.py'
      - '.github/workflows/render-research-gifs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: python -m pip install pillow==11.3.0 cairosvg==2.8.2
      - name: Export animated covers and academic hero
        run: |
          set -euo pipefail
          for source in assets/project-*.svg assets/research-banner.svg; do
            stem="${source##*/}"
            stem="${stem%.svg}"
            python .github/scripts/render_research_gifs.py \
              --input "$source" --output "assets/animated/${stem}.gif"
          done
      - name: Commit updated GIF assets
        run: |
          git add assets/animated/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets: refresh generated research animation GIFs"
            git push
          fi
