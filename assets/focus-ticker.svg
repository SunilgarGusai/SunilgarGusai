<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-labelledby="title desc">
<title id="title">Research focus ticker</title>
<desc id="desc">Animated ticker cycling through Dr. Gusai's four connected research areas.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#081526"/><stop offset=".5" stop-color="#102852"/><stop offset="1" stop-color="#23123f"/></linearGradient>
  <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="76" rx="20" fill="url(#bg)" stroke="#92b4e8" stroke-opacity=".14"/>
<circle cx="33" cy="38" r="5" fill="#45efb5" filter="url(#g)"><animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="54" y="44" fill="#96b3d6" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif" letter-spacing="2.2">RESEARCH SIGNAL</text>
<rect x="235" y="20" width="2" height="36" rx="1" fill="#ffffff" opacity=".12"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">
  <text x="270" y="46" fill="#dcecff" opacity="1">λ  Spectral &amp; Structural Graph Theory<animate attributeName="opacity" values="1;1;0;0;0;0;0;1" keyTimes="0;.20;.25;.45;.50;.70;.75;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="270" y="46" fill="#dcecff" opacity="0">⌘  Network Science &amp; Resilience<animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;.20;.25;.45;.50;.70;.75;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="270" y="46" fill="#dcecff" opacity="0">⬡  Molecular Graphs &amp; QSPR/QSAR<animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;.20;.25;.45;.50;.70;.75;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="270" y="46" fill="#dcecff" opacity="0">◎  Reliable Scientific AI &amp; Uncertainty<animate attributeName="opacity" values="0;0;0;0;0;0;1;1" keyTimes="0;.20;.25;.45;.50;.70;.75;1" dur="12s" repeatCount="indefinite"/></text>
</g>
<rect x="1110" y="19" width="56" height="38" rx="19" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/>
<text x="1138" y="44" text-anchor="middle" fill="#8fe7ff" font-size="13" font-weight="700" font-family="Arial,Helvetica,sans-serif">LIVE</text>
</svg>
