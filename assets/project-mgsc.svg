<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc"><title id="title">Mutation Geodesic Shielding for Protein Stability</title><desc id="desc">Research cover for the mutation geodesic shielding protein-stability repository.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071627"/><stop offset="1" stop-color="#173b55"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56e0d0"/><stop offset="1" stop-color="#7ea7ff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="560" height="250" rx="24" fill="url(#bg)"/><text x="28" y="40" fill="#9bc9da" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2">BIOMOLECULAR NETWORKS</text><text x="28" y="83" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800">Mutation Geodesic</text><text x="28" y="116" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800">Shielding</text><text x="28" y="151" fill="#b9d7e0" font-family="Arial,Helvetica,sans-serif" font-size="16">Residue networks × bypass geometry × stability</text><text x="28" y="205" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800">382,543</text><text x="148" y="204" fill="#afcbd5" font-family="Arial,Helvetica,sans-serif" font-size="15">substitutions</text><text x="300" y="205" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800">38.5%</text><text x="389" y="204" fill="#afcbd5" font-family="Arial,Helvetica,sans-serif" font-size="15">shielded</text><g transform="translate(430 40)" stroke="url(#a)" stroke-width="2" fill="none" opacity=".8"><path d="M8 82 L33 22 L73 8 L110 42 L96 90 L52 105 Z"/><path d="M8 82 L73 8 M33 22 L96 90 M52 105 L110 42