<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
<title id="title">Operation-Marked Route Spectra</title>
<desc id="desc">Illustrative directed graph pathways with subtle animated spectral highlights. This is not an exact witness construction.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081527"/><stop offset=".58" stop-color="#132b55"/><stop offset="1" stop-color="#19183d"/></linearGradient>
  <linearGradient id="edge" x2="1"><stop stop-color="#69dcff"/><stop offset="1" stop-color="#ad92ff"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#61baff" stop-opacity=".36"/><stop offset="1" stop-color="#61baff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="560" height="250" rx="16" fill="url(#bg)"/>
<circle cx="472" cy="116" r="112" fill="url(#halo)">
<animate attributeName="r" values="103;120;103" dur="9s" repeatCount="indefinite"/></circle>
<text x="26" y="35" fill="#8dc8ff" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">GRAPH THEORY · SPECTRAL METHODS</text>
<text x="26" y="82" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800">Operation-Marked</text>
<text x="26" y="117" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800">Route Spectra</text>
<text x="26" y="159" fill="#bdd0e8" font-family="Arial,Helvetica,sans-serif" font-size="13">Exact constructions and symbolic certificates</text>
<path d="M26 179 H292" stroke="#6ea6ff" stroke-width="1.6" opacity=".5"/>
<text x="26" y="219" fill="#80a9db" font-family="Arial,Helvetica,sans-serif" font-size="12">Operation-labelled architecture graphs</text>
<g transform="translate(311 35)" fill="none" stroke="url(#edge)" stroke-width="2.2">
 <path id="p1" d="M20 95 L84 42 L150 69 L206 26"/>
 <path id="p2" d="M20 95 L85 141 L150 69 L205 141"/>
 <path id="p3" d="M84 42 L85 141 L206 26"/>
</g>
<g transform="translate(311 35)" fill="#b6e5ff" stroke="#214778" stroke-width="3">
  <circle cx="20" cy="95" r="8"/><circle cx="84" cy="42" r="8"/>
  <circle cx="85" cy="141" r="8"/><circle cx="150" cy="69" r="9"/>
  <circle cx="206" cy="26" r="8"/><circle cx="205" cy="141" r="8"/>
</g>
<g transform="translate(311 35)" fill="none" stroke="#75edff" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="16 360">
 <path d="M20 95 L84 42 L150 69 L206 26">
  <animate attributeName="stroke-dashoffset" from="0" to="-390" dur="5.8s" repeatCount="indefinite"/>
 </path>
 <path d="M20 95 L85 141 L150 69 L205 141">
  <animate attributeName="stroke-dashoffset" from="30" to="-340" dur="7s" repeatCount="indefinite"/>
 </path>
</g>
<circle cx="461" cy="104" r="5" fill="#88e9ff">
 <animate attributeName="r" values="5;9;5" dur="3.8s" repeatCount="indefinite"/>
 <animate attributeName="opacity" values=".8;.36;.8" dur="3.8s" repeatCount="indefinite"/>
</circle>
</svg>