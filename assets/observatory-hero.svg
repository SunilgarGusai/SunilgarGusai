<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Dr. Sunilgar L. Gusai — Research Observatory</title>
<desc id="desc">Animated academic research banner connecting mathematics, networks, molecular systems and reliable scientific AI.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#040914"/>
    <stop offset=".42" stop-color="#0a1d39"/>
    <stop offset=".72" stop-color="#18245c"/>
    <stop offset="1" stop-color="#32194f"/>
  </linearGradient>
  <radialGradient id="orb" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#7dd3fc" stop-opacity=".28"/>
    <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#53d8ff"/><stop offset=".52" stop-color="#8b7dff"/><stop offset="1" stop-color="#ef79ff"/>
  </linearGradient>
  <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="430" rx="28" fill="url(#bg)"/>
<circle cx="930" cy="205" r="245" fill="url(#orb)"><animate attributeName="r" values="220;265;220" dur="9s" repeatCount="indefinite"/></circle>
<path d="M0 360 C180 320 300 405 470 355 S780 310 1200 360" fill="none" stroke="#7dd3fc" stroke-opacity=".10" stroke-width="2"/>
<path d="M0 378 C190 338 340 412 520 370 S850 335 1200 384" fill="none" stroke="#d78cff" stroke-opacity=".08" stroke-width="2"/>

<text x="58" y="66" fill="#9ab8dc" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="3.4">RESEARCH OBSERVATORY</text>
<text x="58" y="126" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="800">Dr. Sunilgar L. Gusai</text>
<rect x="58" y="147" width="520" height="3" rx="2" fill="url(#line)"/>
<text x="58" y="190" fill="#b7c9e4" font-family="Arial,Helvetica,sans-serif" font-size="20">Assistant Professor · Ph.D. Mathematics · Graph Theorist</text>

<text x="58" y="252" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800">MATHEMATICS</text>
<text x="335" y="252" fill="#68dcff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">→</text>
<text x="385" y="252" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800">NETWORKS</text>
<text x="604" y="252" fill="#9d92ff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">→</text>
<text x="654" y="252" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800">SCIENTIFIC AI</text>
<text x="58" y="298" fill="#a8bdd8" font-family="Arial,Helvetica,sans-serif" font-size="18">Structure · resilience · molecular graphs · uncertainty · reproducibility</text>
<text x="58" y="349" fill="#d8e7f8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">Rigorous mathematics. Inspectable computation. Claims that stay within the evidence.</text>

<g transform="translate(850 70)" fill="none" stroke-linecap="round">
  <g stroke="#83dfff" stroke-opacity=".28" stroke-width="2">
    <path d="M45 55 L155 20 L248 67 L312 26"/>
    <path d="M45 55 L70 150 L170 178 L248 67"/>
    <path d="M70 150 L18 220 L126 277 L170 178"/>
    <path d="M170 178 L272 223 L334 154 L248 67"/>
    <path d="M126 277 L272 223 L322 308"/>
  </g>
  <g stroke="url(#line)" stroke-width="3" stroke-dasharray="14 18" filter="url(#glow)">
    <path d="M45 55 L155 20 L248 67 L312 26"><animate attributeName="stroke-dashoffset" from="0" to="-128" dur="5.8s" repeatCount="indefinite"/></path>
    <path d="M45 55 L70 150 L170 178 L272 223 L334 154"><animate attributeName="stroke-dashoffset" from="0" to="-150" dur="7.2s" repeatCount="indefinite"/></path>
    <path d="M18 220 L126 277 L272 223 L322 308"><animate attributeName="stroke-dashoffset" from="0" to="-140" dur="6.4s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#dff7ff" filter="url(#glow)">
    <circle cx="45" cy="55" r="7"><animate attributeName="r" values="6;10;6" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="155" cy="20" r="6"/><circle cx="248" cy="67" r="7"><animate attributeName="opacity" values=".45;1;.45" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="312" cy="26" r="6"/><circle cx="70" cy="150" r="6"/><circle cx="170" cy="178" r="9"><animate attributeName="r" values="7;11;7" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="220" r="6"/><circle cx="126" cy="277" r="7"/><circle cx="272" cy="223" r="7"/><circle cx="334" cy="154" r="6"/><circle cx="322" cy="308" r="6"/>
  </g>
  <circle r="8" fill="#68e3ff" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M45 55 L70 150 L170 178 L272 223 L334 154"/>
  </circle>
</g>
<rect x="0" y="407" width="1200" height="3" fill="#ffffff" opacity=".05"/>
<rect x="0" y="407" width="300" height="3" fill="url(#line)"><animate attributeName="x" values="-300;1200" dur="8s" repeatCount="indefinite"/></rect>
</svg>